embedding:
  provider: huggingface
  model_name: sentence-transformers/all-MiniLM-L6-v2
  normalize_embeddings: true

 

vector_store:
  persist_directory: data/vector_store/chroma
  collection_name: customer_support_knowledge

 

retrieval:
  dense_candidates: 12
  bm25_candidates: 12
  fused_candidates: 12
  final_results: 5

 

rank_fusion:
  rrf_constant: 60
  dense_weight: 1.0
  bm25_weight: 1.0
  hyde_weight: 0.7

 

reranker:
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2

 

hyde:
  enabled_by_default: false
  model_name: gpt-4o-mini
  temperature: 0.0